<div class="canvas">
  <div class="sheet">
    <header class="site-header">
      <a class="brand" routerLink="/">TrueLine</a>
      <nav>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Latest</a>
        <a routerLink="/admin/new" routerLinkActive="active">Write</a>
        @if (session()) {
          <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        } @else {
          <a routerLink="/login" routerLinkActive="active">Log in</a>
          <a routerLink="/register" routerLinkActive="active">Register</a>
        }
      </nav>
      <button
        type="button"
        class="theme"
        [class.is-dark]="theme() === 'dark'"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <span class="sky sky-day" aria-hidden="true">
          <span class="sun"></span>
          <span class="cloud cloud-a"></span>
          <span class="cloud cloud-b"></span>
        </span>
        <span class="sky sky-night" aria-hidden="true">
          <span class="moon"></span>
          <span class="star star-a"></span>
          <span class="star star-b"></span>
          <span class="star star-c"></span>
          <span class="cloud cloud-night"></span>
        </span>
      </button>
      @if (session(); as account) {
        <div class="profile">
          <button
            type="button"
            class="avatar"
            (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen()"
            aria-label="Account menu"
          >
            @if (account.avatarUrl) {
              <img [src]="account.avatarUrl" alt="" />
            } @else {
              <span>{{ initial(account.name) }}</span>
            }
          </button>
          @if (menuOpen()) {
            <button type="button" class="menu-backdrop" (click)="toggleMenu()" aria-label="Close account menu"></button>
            <div class="menu">
              <button type="button" class="menu-item" (click)="logout()">Log out</button>
            </div>
          }
        </div>
      }
      <a class="mark" routerLink="/" aria-label="TrueLine">
        <img src="favicon.svg" alt="" width="36" height="36" />
      </a>
    </header>
    @if (showTopics()) {
      <nav class="topics" aria-label="Categories">
        @for (category of categories; track category) {
          <a
            [routerLink]="['/']"
            [queryParams]="{ category }"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true, queryParams: 'exact' }"
          >{{ category }}</a>
        }
      </nav>
    }
    <main>
      <router-outlet />
    </main>
  </div>
</div>
